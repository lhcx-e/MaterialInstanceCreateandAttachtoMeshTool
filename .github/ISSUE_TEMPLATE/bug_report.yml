name: Bug report
description: Something did not work as expected
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please fill in as much as you can — engine version and installation method solve most cases.

  - type: input
    id: engine
    attributes:
      label: Unreal Engine version
      placeholder: "5.8.2"
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: How did you install the plugin?
      options:
        - Prebuilt binaries from Releases
        - Compiled from source inside my project
        - Installed in Engine/Plugins/Marketplace
    validations:
      required: true

  - type: dropdown
    id: mesh
    attributes:
      label: Mesh type
      options:
        - Skeletal Mesh
        - Static Mesh
        - Both

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Right-clicked /Game/... on a mesh
        2. Chose Create Material Instances...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Output Log / panel log
      description: Paste anything the tool printed, plus the editor Output Log around the failure.
      render: text
